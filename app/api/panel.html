<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poverty-gateway · 网关面板</title>
<style>
:root {
  --bg: #0b0c0e;
  --bg-panel: #121317;
  --bg-hover: #1a1c21;
  --border: #23252b;
  --border-strong: #2e3138;
  --text: #d6d8dd;
  --text-dim: #8b8f98;
  --text-faint: #5c6068;
  --accent: #4a9eff;
  --ok: #3fb68b;
  --warn: #d8a13a;
  --bad: #d05a5a;
  --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-feature-settings: "tnum";
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 32px 28px 64px; }

/* header */
.topbar {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid var(--border-strong); padding-bottom: 18px; margin-bottom: 28px;
}
.topbar h1 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.topbar h1 .dot { color: var(--accent); }
.topbar .meta { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
.topbar .meta .sep { margin: 0 10px; color: var(--text-faint); }

/* auth gate */
.auth {
  max-width: 420px; margin: 120px auto; border: 1px solid var(--border);
  padding: 32px; background: var(--bg-panel);
}
.auth h2 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.auth p { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }
.auth input {
  width: 100%; background: var(--bg); border: 1px solid var(--border-strong);
  color: var(--text); padding: 9px 12px; font-family: var(--mono); font-size: 13px;
  outline: none;
}
.auth input:focus { border-color: var(--accent); }
.auth .err { color: var(--bad); font-size: 12px; margin-top: 10px; min-height: 18px; }
.auth button {
  margin-top: 14px; width: 100%; background: var(--accent); color: #0b0c0e;
  border: none; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
}

/* grid */
.section-label {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-faint); margin: 30px 0 12px; font-weight: 600;
}
.grid-kpi {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px;
  background: var(--border); border: 1px solid var(--border);
}
.kpi { background: var(--bg-panel); padding: 16px 18px; }
.kpi .label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.kpi .value { font-size: 24px; font-weight: 600; font-family: var(--mono); letter-spacing: .01em; }
.kpi .sub { font-size: 11px; color: var(--text-faint); margin-top: 4px; font-family: var(--mono); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; color: var(--text-faint); font-weight: 500; font-size: 11px;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 14px; border-bottom: 1px solid var(--border-strong);
}
.tbl td { padding: 8px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; }
.tbl tr:hover td { background: var(--bg-hover); }
.tbl .num { text-align: right; }
.tbl .key { color: var(--text); }

/* pool bars */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 120px 1fr 90px; align-items: center; gap: 14px; }
.bar-row .name { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
.bar-row .track { height: 6px; background: var(--bg-hover); border-radius: 0; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--accent); }
.bar-row .val { font-size: 12px; font-family: var(--mono); text-align: right; color: var(--text); }

/* status pill */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 2px 8px; border: 1px solid var(--border-strong); color: var(--text-dim); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
.pill.ok::before { background: var(--ok); }
.pill.warn::before { background: var(--warn); }
.pill.bad::before { background: var(--bad); }

.empty { color: var(--text-faint); font-size: 12px; padding: 20px 0; font-family: var(--mono); }
.stamp { color: var(--text-faint); font-size: 11px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap" id="authGate" style="display:none">
  <div class="auth">
    <h2>Authentication required</h2>
    <p>输入 API key 以查看面板数据。</p>
    <input type="password" id="keyInput" placeholder="sk-…" autocomplete="off">
    <div class="err" id="authErr"></div>
    <button id="authBtn">解锁面板</button>
  </div>
</div>

<div class="wrap" id="panel" style="display:none">
  <div class="topbar">
    <h1><span class="dot">◆</span> poverty-gateway</h1>
    <div class="meta">
      <span id="statusPill" class="pill">—</span>
      <span class="sep">|</span>
      <span id="updated">—</span>
    </div>
  </div>

  <div class="section-label">概述 · Overview</div>
  <div class="grid-kpi" id="kpiRow"></div>

  <div class="section-label">代理池 · Proxy Pool</div>
  <div class="bars" id="poolBars"></div>

  <div class="section-label">每 Key 用量 · Usage by Key</div>
  <table class="tbl" id="usageTable">
    <thead><tr>
      <th>Key</th><th class="num">请求</th><th class="num">成功</th><th class="num">失败</th>
      <th class="num">错误率</th><th class="num">平均延迟</th><th class="num">Token 入</th><th class="num">Token 出</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="usageEmpty" style="display:none">暂无请求记录</div>

  <div class="section-label">模型 · Models</div>
  <div class="empty" id="modelsList"></div>

  <div class="stamp" style="margin-top:40px" id="foot"></div>
</div>

<script>
const API = window.location.origin;
let pollTimer = null;

const $ = (id) => document.getElementById(id);
const fmt = (n) => {
  if (n == null) return "–";
  if (typeof n === "number") return n.toLocaleString("en-US");
  return String(n);
};
const fmtMs = (ms) => ms == null || ms === 0 ? "–" : (ms >= 1000 ? (ms/1000).toFixed(1)+"s" : ms.toFixed(0)+"ms");
const fmtPct = (n) => n == null ? "–" : n.toFixed(2) + "%";
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shortKey = (k) => k.length > 16 ? k.slice(0, 8) + "…" + k.slice(-6) : k;

async function api(path, key) {
  const r = await fetch(path, { headers: { "Authorization": "Bearer " + key } });
  if (r.status === 401) { localStorage.removeItem("pg_key"); return null; }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function kpi(label, value, sub) {
  return `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${value}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>`;
}

function render(data) {
  const t = data.totals || {};
  const p = data.pool || {};
  const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });

  const status = p.available > 0 ? "正常" : (p.cooldown > 0 ? "限流" : "无可用");
  const pill = $("statusPill");
  pill.textContent = status;
  pill.className = "pill " + (p.available > 0 ? "ok" : (p.cooldown > 0 ? "warn" : "bad"));
  $("updated").textContent = "更新于 " + now;

  // KPI
  $("kpiRow").innerHTML =
    kpi("可用代理", p.available, "目标 " + p.target) +
    kpi("冷却中", p.cooldown, "报告 " + p.cooldown_reports) +
    kpi("在途请求", p.in_flight, "上限 " + (p.target * 5)) +
    kpi("补池次数", p.refill_count, "死链 " + p.dead_reports) +
    kpi("总请求", fmt(t.requests), "RPM " + (t.requests_per_min ?? "–")) +
    kpi("成功率", fmtPct(100 - (t.error_rate ?? 0)), "错误 " + fmt(t.error)) +
    kpi("平均延迟", fmtMs(t.avg_latency_ms), "总计 " + fmtMs(0)) +
    kpi("Token 总量", fmt(t.tokens_total), "入 " + fmt(t.tokens_in) + " / 出 " + fmt(t.tokens_out));

  // Pool bars
  const poolTarget = p.target || 12;
  const bars = [
    { name: "可用 available", val: p.available, max: poolTarget, color: "var(--ok)" },
    { name: "冷却 cooldown", val: p.cooldown, max: Math.max(p.cooldown, 20), color: "var(--warn)" },
    { name: "在途 in-flight", val: p.in_flight, max: Math.max(p.in_flight, 10), color: "var(--accent)" },
  ];
  $("poolBars").innerHTML = bars.map(b => {
    const w = Math.min(100, b.max ? (b.val / b.max) * 100 : 0);
    return `<div class="bar-row">
      <div class="name">${b.name}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:${b.color}"></div></div>
      <div class="val">${b.val}</div>
    </div>`;
  }).join("");

  // Usage table
  const keys = Object.entries(data.per_key || {});
  const tb = $("usageTable").querySelector("tbody");
  $("usageEmpty").style.display = keys.length ? "none" : "block";
  $("usageTable").style.display = keys.length ? "table" : "none";
  tb.innerHTML = keys.map(([k, v]) => `<tr>
    <td class="key" title="${esc(k)}">${esc(shortKey(k))}</td>
    <td class="num">${fmt(v.requests)}</td>
    <td class="num">${fmt(v.success)}</td>
    <td class="num">${fmt(v.error)}</td>
    <td class="num">${fmtPct(v.error_rate)}</td>
    <td class="num">${fmtMs(v.avg_latency_ms)}</td>
    <td class="num">${fmt(v.tokens_in)}</td>
    <td class="num">${fmt(v.tokens_out)}</td>
  </tr>`).join("");

  // Models
  api("/v1/models", localStorage.getItem("pg_key")).then(md => {
    const models = (md && md.data) || [];
    $("modelsList").textContent = models.length ? models.map(m => m.id).join("  ·  ") : "无";
  }).catch(() => {});

  // uptime
  const up = data.uptime_seconds || 0;
  const dh = Math.floor(up/3600), dm = Math.floor((up%3600)/60);
  $("foot").textContent = `uptime ${dh}h ${dm}m · ${data.per_key ? Object.keys(data.per_key).length : 0} keys · poverty-gateway`;
}

async function refresh() {
  const key = localStorage.getItem("pg_key");
  if (!key) return;
  try {
    const data = await api("/v1/stats", key);
    if (data) { render(data); $("authErr") && ($("authErr").textContent = ""); }
    else { showAuth(); }
  } catch (e) {
    $("updated").textContent = "拉取失败 " + e.message;
  }
}

function showAuth() {
  $("panel").style.display = "none";
  $("authGate").style.display = "block";
  clearInterval(pollTimer);
}
function showPanel() {
  $("authGate").style.display = "none";
  $("panel").style.display = "block";
  clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 5000);
}

$("authBtn").addEventListener("click", async () => {
  const key = $("keyInput").value.trim();
  if (!key) { $("authErr").textContent = "请输入 API key"; return; }
  const data = await api("/v1/stats", key);
  if (data) {
    localStorage.setItem("pg_key", key);
    $("authErr").textContent = "";
    showPanel();
    render(data);
  } else {
    $("authErr").textContent = "无效的 API key";
  }
});
$("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("authBtn").click(); });

// boot
if (localStorage.getItem("pg_key")) { showPanel(); refresh(); }
else { showAuth(); }
</script>
</body>
</html>
